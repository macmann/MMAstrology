<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#160d36" />
    <title>MMAstrology Offline</title>
    <style>
      :root { color-scheme: dark; }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(circle at 20% 15%, rgba(250, 204, 21, 0.2), transparent 18rem),
          radial-gradient(circle at 80% 20%, rgba(217, 70, 239, 0.22), transparent 18rem),
          linear-gradient(135deg, #160d36 0%, #100a29 55%, #07051a 100%);
        color: #f8fafc;
        font-family: Arial, Helvetica, sans-serif;
      }
      main {
        max-width: 420px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 32px;
        padding: 32px;
        background: rgba(255, 255, 255, 0.08);
        box-shadow: 0 24px 80px rgba(88, 28, 135, 0.35);
      }
      .icon { font-size: 48px; }
      h1 { margin: 18px 0 12px; font-size: 2rem; line-height: 1; }
      p { color: rgba(237, 233, 254, 0.8); line-height: 1.6; }
      a { color: #fde68a; font-weight: 800; }
    </style>
  </head>
  <body>
    <main>
      <div class="icon">🔮</div>
      <h1>You&apos;re offline</h1>
      <p>MMAstrology is installed and ready. Reconnect to continue chats, readings, profile updates, and account actions.</p>
      <p><a href="/">Try the home screen again</a></p>
    </main>
  </body>
</html>
