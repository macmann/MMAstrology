services:
  - type: web
    name: nat-khat-ai-web
    runtime: node
    plan: free
    buildCommand: npm install && npm run render:build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: nat-khat-ai-db
          property: connectionString
      - key: JWT_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GOOGLE_GENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: XAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: lifereadingmodel
        value: gpt-5.5
      - key: ANTHROPIC_MODEL
        value: claude-3-5-haiku-latest
      - key: GOOGLE_GENAI_MODEL
        value: gemini-1.5-flash
      - key: XAI_MODEL
        value: grok-2-latest
      - key: ADMIN_SECRET
        sync: false

databases:
  - name: nat-khat-ai-db
    plan: free
    databaseName: natkhatai
    user: natkhatai
