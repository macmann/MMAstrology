services:
  - type: web
    name: mmastrology-web
    runtime: node
    plan: free
    buildCommand: npm install && npx prisma generate && npx prisma db push && npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mmastrology-db
          property: connectionString
      - key: NEXTAUTH_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: XAI_API_KEY
        sync: false
      - key: ADMIN_SECRET
        sync: false

databases:
  - name: mmastrology-db
    plan: free
    databaseName: mmastrology
    user: mmastrology
